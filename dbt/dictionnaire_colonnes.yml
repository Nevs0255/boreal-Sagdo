# Dictionnaire des colonnes : une définition par notion, utilisée par le catalogue (pipeline/catalogue.py)
# pour toute colonne qui n'a pas de description propre dans les fichiers de modèles dbt.

# Colonnes techniques
_fichier_source: "Fichier d'origine de la ligne, relatif au dossier des sources."
_numero_ligne: "Numéro de la ligne dans le fichier d'origine (1 = en-tête pour un CSV)."
_id_chargement: "Identifiant du chargement du fichier (journal d'ingestion)."
_date_chargement: "Horodatage de l'exécution d'ingestion qui a chargé la ligne."
_maj_le: "Date du dernier chargement brut ayant concerné la ligne."
colonnes_illisibles: "Colonnes renseignées en brut mais illisibles dans leur type cible."
anomalies: "Liste des règles de qualité violées par la ligne (voir qualite.regles_qualite)."
anomalies_signalees: "Règles de qualité non bloquantes (CORRIGER, SIGNALER) relevées sur la ligne."
est_exclu: "Vrai si au moins une règle EXCLURE est violée : la ligne part en quarantaine."
motif: "Règles EXCLURE violées et leur libellé : raison de la mise en quarantaine."
rang_id: "Rang de la ligne parmi celles de même identifiant (1 = conservée)."
rang_livraison: "Rang de la livraison d'un paiement (1 = première livraison, conservée ; > 1 = copie écartée)."
dbt_scd_id: "Identifiant technique de la version (snapshot dbt)."
dbt_updated_at: "Date de prise en compte de la version (snapshot dbt)."
dbt_valid_from: "Début de validité de la version."
dbt_valid_to: "Fin de validité de la version (vide pour la version courante)."

# Clients
client_id: "Identifiant pseudonymisé du client (CRM)."
client_id_retenu: "Identifiant du client conservé après rapprochement des doublons."
client_retenu_exclu: "Vrai si le client conservé est lui-même en quarantaine."
date_naissance: "Date de naissance du client."
date_naissance_corrigee: "Date de naissance après correction (vide si sentinelle ou impossible : règles CLI_02, CLI_03)."
region: "Code de la région de résidence (ex. IDF, ARA)."
csp: "Catégorie socioprofessionnelle."
consent_marketing: "Consentement à la prospection commerciale (1 = oui)."
email_hash: "Empreinte pseudonymisée de l'adresse e-mail, clé de rapprochement des doublons."
est_efface: "Vrai si les attributs personnels du client ont été effacés (droit à l'effacement)."
multi_detenteur: "Vrai si le client a détenu au moins un contrat auto et un contrat habitation."
produits: "Produits détenus par le client sur la période (AUTO, HABITATION ou AUTO+HABITATION)."
canaux: "Canaux de distribution des contrats du client."
client_actif: "Vrai si le client a au moins un contrat non résilié au 30/06/2025."
primes_acquises: "Primes acquises par le client, 2020 au 30/06/2025."
sinistres_payes: "Règlements payés sur les sinistres du client, 2020 au 30/06/2025."
nb_produits: "Nombre de produits différents détenus à la date de référence (1 ou 2)."
nb_clients: "Nombre de clients."
nb_clients_retenus: "Clients ayant encore au moins un contrat actif un an après la date de référence."
date_reference: "Date de référence (1er janvier) de la mesure de rétention."

# Contrats
contrat_id: "Identifiant du contrat."
produit: "Produit : AUTO ou HABITATION."
formule: "Formule souscrite : ESSENTIELLE, CONFORT ou PREMIUM."
canal_distribution: "Canal de souscription : AGENT, COURTIER ou WEB."
zone_risque: "Zone de risque tarifaire, de 1 (faible) à 5 (élevé)."
franchise: "Franchise du contrat, en euros."
bonus_malus: "Coefficient de bonus-malus (auto uniquement)."
puissance_cv: "Puissance fiscale du véhicule en chevaux (auto uniquement)."
surface_m2: "Surface du logement en m² (habitation uniquement)."
prime_annuelle: "Prime annuelle du contrat, en euros."
date_effet: "Date de début de couverture."
date_resiliation: "Date de fin de couverture (vide si le contrat est en cours)."
est_resilie: "Vrai si le contrat a une date de résiliation."
date_debut_periode: "Premier jour couvert dans l'année."
date_fin_periode: "Dernier jour couvert dans l'année."
contrat_connu: "Vrai si le contrat du sinistre existe dans les contrats."
contrat_exclu: "Vrai si le contrat du sinistre est en quarantaine."
contrat_date_effet: "Date d'effet du contrat du sinistre."
contrat_date_resiliation: "Date de résiliation du contrat du sinistre."
detenait_autre_produit: "Vrai si le client détenait déjà un contrat actif de l'autre produit à la date d'effet."
nb_contrats: "Nombre de contrats."
nb_contrats_exposes: "Nombre de contrats couverts au moins un jour sur la période."
contrats_actifs: "Contrats couverts le dernier jour du mois (ou au 30/06/2025)."
cohorte: "Année de souscription (date d'effet du contrat, ou du premier contrat pour un client)."
anciennete_annees: "Ancienneté du contrat, en années révolues depuis la date d'effet."
nb_retenus: "Contrats non résiliés à l'anniversaire considéré."
nb_observables: "Contrats dont l'anniversaire considéré est antérieur au 30/06/2025."

# Sinistres et règlements
sinistre_id: "Identifiant du sinistre."
date_survenance: "Date de survenance du sinistre."
date_declaration: "Date de déclaration du sinistre à l'assureur."
annee_survenance: "Année de survenance du sinistre."
garantie: "Garantie mise en jeu (RC, COLLISION, BRIS_GLACE, VOL, DEGAT_EAUX, INCENDIE, TEMPETE)."
libelle_garantie: "Libellé métier de la garantie."
garantie_compatible: "Vrai si la garantie existe pour le produit du contrat."
statut: "Statut : OUVERT, CLOTURE, REJETE ou SANS_SUITE (sinistres) ; résultat d'un test (exploitation)."
reserve_initiale: "Réserve ouverte à la déclaration, en euros."
sinistre_connu: "Vrai si le sinistre du paiement existe."
sinistre_exclu: "Vrai si le sinistre du paiement est en quarantaine."
sinistre_date_survenance: "Date de survenance du sinistre du paiement."
sinistre_statut: "Statut du sinistre du paiement."
date_premier_reglement: "Date du premier paiement du sinistre."
date_dernier_reglement: "Date du dernier paiement du sinistre (date de clôture de substitution)."
nb_reglements: "Nombre de paiements du sinistre."
anciennete_contrat_j: "Jours entre la date d'effet du contrat et la survenance du sinistre."
date_audit: "Date de l'audit antifraude."
delai_audit_j: "Jours entre la déclaration et l'audit."
fraude_confirmee: "Résultat de l'audit : fraude confirmée (vide si non audité)."
montant_paye_avant_audit: "Montants payés sur le sinistre avant la date d'audit."
nb_sinistres_atypiques: "Sinistres à réserve initiale supérieure à 1 M€ (règle SIN_08)."
paiement_id: "Identifiant du paiement."
date_paiement: "Date du paiement."
montant: "Montant payé, en euros."
mois_livraison: "Mois du fichier de livraison (AAAA_MM)."
nb_livraisons: "Nombre de fichiers ayant livré le paiement (2 = livré en double)."

# Temps
date_jour: "Jour calendaire."
annee: "Année civile."
trimestre: "Trimestre (1 à 4)."
mois: "Premier jour du mois."
num_mois: "Numéro du mois (1 à 12)."
annee_mois: "Mois au format AAAA-MM."
jour_semaine: "Jour de la semaine (1 = lundi, 7 = dimanche)."
est_apres_extraction: "Vrai après le 30/06/2025 : période non observée."

# Qualité
regle_id: "Identifiant de la règle de qualité (préfixe = source : CLI, CTR, SIN, REG, AUD)."
entite: "Source contrôlée par la règle."
dimension: "Dimension de qualité : complétude, unicité, validité, cohérence entre tables, cohérence temporelle."
description: "Libellé de la règle."
gravite: "Gravité : CRITIQUE (ligne inexploitable), MAJEURE (fausse un indicateur), MINEURE (exploitable avec réserve)."
traitement: "Traitement : EXCLURE (quarantaine), CORRIGER (valeur corrigée) ou SIGNALER (conservée telle quelle)."
volume: "Nombre de lignes concernées par la règle."
lignes_source: "Nombre de lignes de la source contrôlée."
pct_lignes: "Part des lignes de la source concernées, en %."
libelle: "Libellé métier."

# Exploitation
source: "Source de données : clients, contrats, sinistres, reglements ou audits."
fichier: "Fichier source, relatif au dossier des sources."
sha256: "Empreinte SHA-256 du contenu du fichier (détection des fichiers déjà chargés)."
encodage: "Encodage détecté du fichier."
separateur: "Séparateur détecté (CSV)."
lignes_lues: "Lignes de données lues dans le fichier."
lignes_chargees: "Lignes chargées dans la couche brute."
lignes_rejetees: "Lignes illisibles envoyées dans raw.rejets_ingestion."
debut: "Horodatage du traitement du fichier."
duree_s: "Durée du traitement, en secondes."
message: "Message complémentaire (motif d'échec, fichier homonyme…)."
id_execution: "Identifiant de l'exécution (ingestion ou dbt)."
id_chargement: "Identifiant du chargement du fichier."
numero_ligne: "Numéro de la ligne dans le fichier d'origine."
contenu: "Contenu brut de la ligne rejetée."
nb_fichiers: "Nombre de fichiers chargés pour la source."
dernier_chargement: "Horodatage du dernier chargement réussi."
dernier_fichier: "Dernier fichier (par ordre alphabétique) de la version chargée."
dernier_passage: "Dernière exécution ayant traité la source, chargement ou non."
dernier_echec: "Dernier chargement en échec (vide si aucun)."
date_metier_max: "Date métier la plus récente de la source (paiement, déclaration, effet, audit)."
genere_le: "Horodatage de l'exécution des tests."
outil: "Outil ayant exécuté le test (dbt)."
nom: "Nom du test."
objet: "Identifiant complet du test dans dbt."
echecs: "Nombre de lignes en échec renvoyées par le test."
demande_le: "Date d'application de l'effacement."
