version: 2

models:
  - name: mart_contrat_annee
    description: "Base d'analyse au grain contrat × année : exposition, primes acquises, résiliations et sinistres de l'année de survenance. Mesures additives."
    columns:
      - name: exposition_id
        description: "Clé contrat-année."
        data_tests: [unique, not_null]
      - name: annees_police
        description: "Exposition en années-police (jours couverts / 365)."
      - name: prime_acquise
        description: "Prime acquise sur la période couverte de l'année."
      - name: nb_resiliations
        description: "1 si le contrat est résilié dans l'année."
      - name: nb_sinistres_declares
        description: "Sinistres survenus dans l'année, tous statuts."
      - name: nb_sinistres
        description: "Sinistres avec suite (ouverts ou clôturés) survenus dans l'année : base de la fréquence et du coût moyen."
      - name: nb_sinistres_sans_suite
        description: "Sinistres rejetés ou classés sans suite."
      - name: montant_paye
        description: "Règlements payés sur les sinistres de l'année."
      - name: reserve_restante
        description: "Réserves restantes des sinistres encore ouverts."
      - name: charge
        description: "Charge sinistres = payé + réserve restante."
      - name: charge_hors_atypique
        description: "Charge hors sinistre atypique (réserve > 1 M€, règle SIN_08)."

  - name: mart_technique
    description: "Indicateurs agrégés par année, produit, zone, formule, canal, région et tranche d'âge. Fréquence = nb_sinistres / annees_police ; coût moyen = charge / nb_sinistres ; prime moyenne = prime_acquise / annees_police ; S/P = charge / prime_acquise ; taux de résiliation = nb_resiliations / annees_police."

  - name: mart_sinistres
    description: "Un sinistre valide par ligne, enrichi des attributs du contrat, du client et de la garantie."
    columns:
      - name: sinistre_id
        data_tests: [unique, not_null]

  - name: mart_retention_contrats
    description: "Rétention des contrats par cohorte de souscription, produit, détention de l'autre produit à la souscription et ancienneté (1 à 5 ans). Taux = nb_retenus / nb_contrats, valable seulement si cellule_complete."
    columns:
      - name: cellule_complete
        description: "Vrai si tous les contrats de la cellule ont atteint l'anniversaire avant le 30/06/2025."
  - name: mart_retention_clients
    description: "Rétention client à un an depuis le 1er janvier 2021 à 2024, selon le nombre de produits détenus (1 ou 2)."
  - name: mart_clients
    description: "Un client par ligne : produits détenus, primes acquises, sinistres payés, valeur observée (primes acquises − sinistres payés)."
    columns:
      - name: client_id
        data_tests: [unique, not_null]
      - name: valeur_observee
        description: "Primes acquises moins sinistres payés, de 2020 au 30/06/2025 (réserves non déduites)."
  - name: mart_portefeuille_mensuel
    description: "Suivi mensuel (page Portefeuille) : mois × produit × zone × canal × région ; primes acquises, années-police, contrats actifs, résiliations et sinistres du mois de survenance."
    columns:
      - name: prime_acquise
        description: "Primes acquises dans le mois (prime annuelle × jours couverts dans le mois / 365)."
      - name: annees_police
        description: "Exposition du mois en années-police."
      - name: nb_resiliations
        description: "Contrats résiliés dans le mois."
  - name: mart_exploitation_chargements
    description: "État de la chaîne par source (page Exploitation) : dernier chargement, volumes, rejets, échecs et fraîcheur des données."
  - name: mart_exploitation_regles
    description: "Volume par règle de qualité (page Exploitation), copie de qualite.bilan_regles."
  - name: mart_exploitation_tests
    description: "Résultats des tests de la dernière exécution (page Exploitation). Vue sur meta.resultats_tests."
