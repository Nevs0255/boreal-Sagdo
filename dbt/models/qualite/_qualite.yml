version: 2

models:
  - name: bilan_regles
    description: "Volume constaté pour chaque règle de qualité, y compris les règles sans anomalie."
    columns:
      - name: regle_id
        data_tests: [unique, not_null]

seeds:
  - name: regles_qualite
    description: "Catalogue des règles de qualité : dimension, gravité et traitement (EXCLURE, CORRIGER, SIGNALER)."
    columns:
      - name: regle_id
        data_tests: [unique, not_null]
      - name: traitement
        data_tests:
          - accepted_values: {arguments: {values: ['EXCLURE', 'CORRIGER', 'SIGNALER']}}
  - name: referentiel_garanties
    description: "Garanties autorisées par produit."
